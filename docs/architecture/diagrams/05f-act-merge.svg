<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:894px;height:1521px;background:#FFFFFF;" width="894px" height="1521px" viewBox="0 0 894 1521" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="3"><text x="256.594" y="33.535" fill="#000" font-size="14" textLength="379.019" font-weight="700" font-family="Inter">Activity: merge two athletes ("Unește cu alt sportiv")</text></g><rect x="20" y="53.941" width="847.207" height="16.488" fill="none" style="stroke:none;"/><ellipse cx="170.866" cy="85.43" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="26" y="115.43" width="289.732" height="69.465" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="36" y="138.965" fill="#000" font-size="14" textLength="254.27" font-family="Inter">"Unește cu alt sportiv" (record menu),</text><text x="36" y="155.453" fill="#000" font-size="14" textLength="269.732" font-family="Inter">or "Unește" on a possible-duplicate line</text><text x="36" y="171.941" fill="#000" font-size="14" textLength="178.698" font-family="Inter">(other athlete preselected)</text><rect x="76.22" y="204.895" width="189.292" height="36.488" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="86.22" y="228.43" fill="#000" font-size="14" textLength="169.292" font-family="Inter">Pick which record is kept</text><rect x="79.847" y="390.848" width="182.039" height="52.977" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="89.847" y="414.383" fill="#000" font-size="14" textLength="158.942" font-family="Inter">For each differing field,</text><text x="89.847" y="430.871" fill="#000" font-size="14" textLength="162.039" font-family="Inter">pick which value is kept</text><rect x="30.327" y="463.824" width="281.078" height="52.977" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="40.327" y="487.359" fill="#000" font-size="14" textLength="211.21" font-family="Inter">Confirm "Unești cele două fișe?</text><text x="40.327" y="503.848" fill="#000" font-size="14" textLength="261.078" font-family="Inter">Cealaltă se șterge. Nu se poate anula."</text><line x1="20" y1="53.941" x2="20" y2="1500.961" style="stroke:#C8CCD8;stroke-width:1.5;"/><rect x="441.924" y="261.383" width="284.756" height="52.977" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="451.924" y="284.918" fill="#000" font-size="14" textLength="264.756" font-family="Inter">Load both sides (values, memberships,</text><text x="451.924" y="301.406" fill="#000" font-size="14" textLength="180.77" font-family="Inter">A.C.S. rows, profile, notes)</text><rect x="487.342" y="334.359" width="193.92" height="36.488" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="497.342" y="357.895" fill="#000" font-size="14" textLength="173.92" font-family="Inter">Diff fields -> comparison</text><rect x="501.872" y="536.801" width="164.86" height="36.488" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="511.872" y="560.336" fill="#000" font-size="14" textLength="144.86" font-family="Inter">All in one transaction</text><rect x="447.267" y="593.289" width="274.071" height="85.953" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="457.267" y="616.824" fill="#000" font-size="14" textLength="200.669" font-family="Inter">Re-link the removed athlete's</text><text x="457.267" y="633.313" fill="#000" font-size="14" textLength="198.673" font-family="Inter">registrations to the kept one;</text><text x="457.267" y="649.801" fill="#000" font-size="14" textLength="221.813" font-family="Inter">clear any confirmation record on</text><text x="457.267" y="666.289" fill="#000" font-size="14" textLength="254.071" font-family="Inter">either side (no undo is possible after)</text><rect x="435.119" y="699.242" width="298.366" height="85.953" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="445.119" y="722.777" fill="#000" font-size="14" textLength="278.366" font-family="Inter">Memberships: same group+season twice</text><text x="445.119" y="739.266" fill="#000" font-size="14" textLength="206.972" font-family="Inter">is kept once; otherwise moved</text><text x="445.119" y="755.754" fill="#000" font-size="14" textLength="245.499" font-family="Inter">(main only if the kept side had none</text><text x="445.119" y="772.242" fill="#000" font-size="14" textLength="82.968" font-family="Inter">that season)</text><rect x="432.269" y="805.195" width="304.067" height="69.465" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="442.269" y="828.73" fill="#000" font-size="14" textLength="213.965" font-family="Inter">A.C.S. rows: moved per season;</text><text x="442.269" y="845.219" fill="#000" font-size="14" textLength="284.067" font-family="Inter">the higher state wins when both have one</text><text x="442.269" y="861.707" fill="#000" font-size="14" textLength="163.379" font-family="Inter">(da > în așteptare > nu)</text><rect x="438.571" y="894.66" width="291.462" height="85.953" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="448.571" y="918.195" fill="#000" font-size="14" textLength="271.462" font-family="Inter">Possible-duplicate pairs of the removed</text><text x="448.571" y="934.684" fill="#000" font-size="14" textLength="224.889" font-family="Inter">athlete repointed to the kept one</text><text x="448.571" y="951.172" fill="#000" font-size="14" textLength="241.397" font-family="Inter">(a pair with the kept athlete already</text><text x="448.571" y="967.66" fill="#000" font-size="14" textLength="188.638" font-family="Inter">merges its "dismissed" flag)</text><polygon points="494.345,1000.613,674.26,1000.613,686.26,1012.613,674.26,1024.613,494.345,1024.613,482.345,1012.613,494.345,1000.613" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="494.345" y="1017.904" fill="#000" font-size="14" textLength="179.915" font-family="Inter">both have a public profile?</text><text x="460.094" y="1009.66" fill="#000" font-size="14" textLength="22.251" font-family="Inter">yes</text><text x="686.26" y="1009.66" fill="#000" font-size="14" textLength="146.925" font-family="Inter">only one has a profile</text><rect x="325.732" y="1034.613" width="239.01" height="85.953" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="335.732" y="1058.148" fill="#000" font-size="14" textLength="205.263" font-family="Inter">Kept profile stays; the other is</text><text x="335.732" y="1074.637" fill="#000" font-size="14" textLength="182.082" font-family="Inter">deleted; its slug (+ its own</text><text x="335.732" y="1091.125" fill="#000" font-size="14" textLength="196.526" font-family="Inter">previousSlugs) joins the kept</text><text x="335.732" y="1107.613" fill="#000" font-size="14" textLength="219.01" font-family="Inter">profile's previousSlugs (redirect)</text><rect x="584.742" y="1034.613" width="277.25" height="36.488" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="594.742" y="1058.148" fill="#000" font-size="14" textLength="257.25" font-family="Inter">That profile moves to the kept athlete</text><polygon points="584.302,1126.566,596.302,1138.566,584.302,1150.566,572.302,1138.566,584.302,1126.566" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="434.941" y="1170.566" width="298.722" height="69.465" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="444.941" y="1194.102" fill="#000" font-size="14" textLength="240.249" font-family="Inter">Write the kept athlete's picked field</text><text x="444.941" y="1210.59" fill="#000" font-size="14" textLength="278.722" font-family="Inter">values, dataIncomplete; notes appended;</text><text x="444.941" y="1227.078" fill="#000" font-size="14" textLength="246.183" font-family="Inter">rename the profile to the kept name</text><rect x="419.584" y="1260.031" width="329.436" height="69.465" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="429.584" y="1283.566" fill="#000" font-size="14" textLength="237.836" font-family="Inter">Move the removed athlete's history</text><text x="429.584" y="1300.055" fill="#000" font-size="14" textLength="108.397" font-family="Inter">to the kept one;</text><text x="429.584" y="1316.543" fill="#000" font-size="14" textLength="309.436" font-family="Inter">History "Unit cu &lt;nume>" on the kept athlete</text><rect x="482.414" y="1349.496" width="203.777" height="36.488" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="492.414" y="1373.031" fill="#000" font-size="14" textLength="183.777" font-family="Inter">Delete the removed athlete</text><rect x="458.662" y="1405.984" width="251.28" height="52.977" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="468.662" y="1429.52" fill="#000" font-size="14" textLength="231.28" font-family="Inter">Refresh every registration's match</text><text x="468.662" y="1446.008" fill="#000" font-size="14" textLength="216.453" font-family="Inter">(best effort, failure only logged)</text><ellipse cx="584.302" cy="1489.961" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="584.302" cy="1489.961" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="319.732" y1="53.941" x2="319.732" y2="1500.961" style="stroke:#C8CCD8;stroke-width:1.5;"/><line x1="865.992" y1="53.941" x2="865.992" y2="1500.961" style="stroke:#C8CCD8;stroke-width:1.5;"/><line x1="170.866" y1="95.43" x2="170.866" y2="115.43" style="stroke:#5B6380;stroke-width:1;"/><polygon points="166.866,105.43,170.866,115.43,174.866,105.43,170.866,109.43" fill="#5B6380" style="stroke:#5B6380;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="170.866" y1="184.895" x2="170.866" y2="204.895" style="stroke:#5B6380;stroke-width:1;"/><polygon points="166.866,194.895,170.866,204.895,174.866,194.895,170.866,198.895" fill="#5B6380" style="stroke:#5B6380;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="170.866" y1="443.824" x2="170.866" y2="463.824" style="stroke:#5B6380;stroke-width:1;"/><polygon points="166.866,453.824,170.866,463.824,174.866,453.824,170.866,457.824" fill="#5B6380" style="stroke:#5B6380;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="584.302" y1="314.359" x2="584.302" y2="334.359" style="stroke:#5B6380;stroke-width:1;"/><polygon points="580.302,324.359,584.302,334.359,588.302,324.359,584.302,328.359" fill="#5B6380" style="stroke:#5B6380;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="584.302" y1="573.289" x2="584.302" y2="593.289" style="stroke:#5B6380;stroke-width:1;"/><polygon points="580.302,583.289,584.302,593.289,588.302,583.289,584.302,587.289" fill="#5B6380" style="stroke:#5B6380;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="584.302" y1="679.242" x2="584.302" y2="699.242" style="stroke:#5B6380;stroke-width:1;"/><polygon points="580.302,689.242,584.302,699.242,588.302,689.242,584.302,693.242" fill="#5B6380" style="stroke:#5B6380;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="584.302" y1="785.195" x2="584.302" y2="805.195" style="stroke:#5B6380;stroke-width:1;"/><polygon points="580.302,795.195,584.302,805.195,588.302,795.195,584.302,799.195" fill="#5B6380" style="stroke:#5B6380;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="584.302" y1="874.66" x2="584.302" y2="894.66" style="stroke:#5B6380;stroke-width:1;"/><polygon points="580.302,884.66,584.302,894.6