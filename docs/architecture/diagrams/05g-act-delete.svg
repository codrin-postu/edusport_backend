<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:648px;height:965px;background:#FFFFFF;" width="648px" height="965px" viewBox="0 0 648 965" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="3"><text x="160.025" y="33.535" fill="#000" font-size="14" textLength="325.958" font-weight="700" font-family="Inter">Activity: delete an athlete ("Șterge sportivul")</text></g><rect x="20" y="53.941" width="601.008" height="16.488" fill="none" style="stroke:none;"/><ellipse cx="169.909" cy="85.43" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="51.252" y="115.43" width="237.314" height="36.488" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="61.252" y="138.965" fill="#000" font-size="14" textLength="217.314" font-family="Inter">"Șterge sportivul" (record menu)</text><rect x="26" y="171.918" width="287.818" height="85.953" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="36" y="195.453" fill="#000" font-size="14" textLength="267.818" font-family="Inter">Confirm - "&lt;nume> se șterge definitiv,</text><text x="36" y="211.941" fill="#000" font-size="14" textLength="265.405" font-family="Inter">împreună cu profilul public, rezultatele</text><text x="36" y="228.43" fill="#000" font-size="14" textLength="240.905" font-family="Inter">și sezoanele. Înscrierile rămân, fără</text><text x="36" y="244.918" fill="#000" font-size="14" textLength="196.533" font-family="Inter">legătură. Nu se poate anula."</text><line x1="20" y1="53.941" x2="20" y2="944.951" style="stroke:#C8CCD8;stroke-width:1.5;"/><rect x="387.375" y="277.871" width="164.86" height="36.488" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="397.375" y="301.406" fill="#000" font-size="14" textLength="144.86" font-family="Inter">All in one transaction</text><rect x="323.818" y="334.359" width="291.975" height="69.465" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="333.818" y="357.895" fill="#000" font-size="14" textLength="265.494" font-family="Inter">Unlink every registration of this athlete</text><text x="333.818" y="374.383" fill="#000" font-size="14" textLength="236.975" font-family="Inter">(clears its ConfirmationRecord too;</text><text x="333.818" y="390.871" fill="#000" font-size="14" textLength="271.975" font-family="Inter">each shows "Confirmă înscrierea" again)</text><rect x="357.038" y="423.824" width="225.536" height="52.977" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="367.038" y="447.359" fill="#000" font-size="14" textLength="205.536" font-family="Inter">Delete its group memberships</text><text x="367.038" y="463.848" fill="#000" font-size="14" textLength="106.518" font-family="Inter">and A.C.S. rows</text><rect x="343.222" y="496.801" width="253.167" height="36.488" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="353.222" y="520.336" fill="#000" font-size="14" textLength="233.167" font-family="Inter">Delete its possible-duplicate pairs</text><rect x="370.426" y="603.533" width="198.76" height="52.977" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="380.426" y="627.068" fill="#000" font-size="14" textLength="115.35" font-family="Inter">Delete it, with its</text><text x="380.426" y="643.557" fill="#000" font-size="14" textLength="178.76" font-family="Inter">competition participations</text><polygon points="401.686,553.289,537.926,553.289,549.926,565.289,537.926,577.289,401.686,577.289,389.686,565.289,401.686,553.289" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="473.806" y="590.824" fill="#000" font-size="14" textLength="22.251" font-family="Inter">yes</text><text x="401.686" y="570.58" fill="#000" font-size="14" textLength="136.24" font-family="Inter">has a public profile?</text><polygon points="469.806,676.51,481.806,688.51,469.806,700.51,457.806,688.51,469.806,676.51" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="331.922" y="720.51" width="275.767" height="52.977" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="341.922" y="744.045" fill="#000" font-size="14" textLength="217.28" font-family="Inter">History "Sportiv șters: &lt;nume>"</text><text x="341.922" y="760.533" fill="#000" font-size="14" textLength="255.767" font-family="Inter">(kept for audit, shown nowhere in 3B)</text><rect x="399.66" y="793.486" width="140.292" height="36.488" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="409.66" y="817.021" fill="#000" font-size="14" textLength="120.292" font-family="Inter">Delete the athlete</text><rect x="344.166" y="849.975" width="251.28" height="52.977" fill="#EEF2FF" style="stroke:#3B4A9A;stroke-width:0.5;" rx="4" ry="4"/><text x="354.166" y="873.51" fill="#000" font-size="14" textLength="231.28" font-family="Inter">Refresh every registration's match</text><text x="354.166" y="889.998" fill="#000" font-size="14" textLength="216.453" font-family="Inter">(best effort, failure only logged)</text><ellipse cx="469.806" cy="933.951" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="469.806" cy="933.951" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="317.818" y1="53.941" x2="317.818" y2="944.951" style="stroke:#C8CCD8;stroke-width:1.5;"/><line x1="619.793" y1="53.941" x2="619.793" y2="944.951" style="stroke:#C8CCD8;stroke-width:1.5;"/><line x1="169.909" y1="95.43" x2="169.909" y2="115.43" style="stroke:#5B6380;stroke-width:1;"/><polygon points="165.909,105.43,169.909,115.43,173.909,105.43,169.909,109.43" fill="#5B6380" style="s