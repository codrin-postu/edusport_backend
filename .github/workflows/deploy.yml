# Manual deploy for the Strapi backend.
#
# Trigger:
#   GitHub → Actions → Deploy backend → Run workflow → pick a branch/tag.
#
# Each check and each deploy phase is its own JOB, so the Actions graph shows a
# separate node per step. This repo has no lint script or tests yet, so
# typecheck + audit run as informational (non-gating); the secret scan gates
# the deploy.
#
#   secret-scan (blocking)      typecheck, audit (informational)
#         └─> deploy-pull -> deploy-build -> deploy-up -> deploy-health
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VM_HOST           - public hostname or IP of the production VM
#   VM_USER           - SSH user on the VM with docker access (e.g. `codrin`)
#   VM_SSH_KEY        - Private SSH key matching an authorized_keys entry on the VM
#   VM_BACKEND_PATH   - absolute path to the cloned repo on the VM (e.g. /opt/edusport/edusport_backend)

name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy (defaults to main)"
        required: false
        default: main

concurrency:
  group: deploy-backend-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------- checks ----------
  typecheck:
    name: Typecheck (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --no-banner --redact --exit-code 1

  # ---------- deploy (gated on the blocking check) ----------
  deploy-pull:
    name: Deploy · pull
    needs: [secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch + reset to the chosen ref on the VM
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_REF: ${{ inputs.ref }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: DEPLOY_REF
          script: |
            set -euo pipefail
            cd "${{ secrets.VM_BACKEND_PATH }}"
            git fetch --prune
            git reset --hard "origin/${DEPLOY_REF}"

  deploy-build:
    name: Deploy · build
    needs: deploy-pull
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VM_BACKEND_PATH }}"
            ./scripts/deploy.sh build

  deploy-up:
    name: Deploy · up
    needs: deploy-build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VM_BACKEND_PATH }}"
            ./scripts/deploy.sh up

  deploy-health:
    name: Deploy · health
    needs: deploy-up
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VM_BACKEND_PATH }}"
            ./scripts/deploy.sh health
