# Production stack for the EduSport CMS.
# Postgres + Strapi backend on the shared external `edusport_net` network.
# The reverse proxy (separate compose or host nginx) is what exposes ports 80/443.

services:
  postgres:
    image: postgres:16-alpine
    container_name: edusport_postgres
    env_file: .env.production
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - edusport_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: edusport_backend
    # --- Hardening, added 2026-09-16 after the frontend RCE compromise -------
    # The attacker dropped a binary into the container's /tmp and executed it.
    # A noexec /tmp removes that step entirely. Deliberately NOT read_only here:
    # unlike the frontend, Strapi writes into its own tree at runtime (.tmp,
    # .strapi, upload staging), so a read-only rootfs would break it. The cheap,
    # high-value settings apply either way.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "1337"
    ports:
      # Bound to VM loopback only so the host (or an SSH tunnel) can reach
      # the admin panel during setup. nginx on the VM will be the public
      # entry point once TLS is configured.
      - "127.0.0.1:1337:1337"
    volumes:
      - uploads:/opt/app/public/uploads
    networks:
      - edusport_net
    restart: unless-stopped

networks:
  edusport_net:
    external: true

volumes:
  pgdata:
  uploads:
