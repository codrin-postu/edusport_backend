# Development only. Production uses docker-compose.production.yml.
# Secrets here have sensible local-dev defaults but can be overridden via .env.
#
# Joins the shared external `edusport_net`, mirroring production, so the
# frontend, umami and glitchtip compose projects in the sibling repos can reach
# these containers by name. Create it once before the first `up`:
#
#   docker network create edusport_net

services:
  strapi:
    build: .
    container_name: strapi_app
    ports:
      - "1337:1337"
      - "5173:5173"
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-edusport_postgres}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-strapi}
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${APP_KEYS:-localDevKey1,localDevKey2}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-localDevApiTokenSalt}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-localDevAdminJwtSecret}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-localDevTransferTokenSalt}
      JWT_SECRET: ${JWT_SECRET:-localDevJwtSecret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-localDevEncryptionKey}
      # Frontend route that renders unpublished article drafts using the same
      # _View component as production. Used by the admin's Previzualizează
      # button to open a side-panel preview.
      STRAPI_PREVIEW_FRONTEND_URL: ${STRAPI_PREVIEW_FRONTEND_URL:-http://localhost:3000}
      STRAPI_PREVIEW_SECRET: ${STRAPI_PREVIEW_SECRET:-localDevPreviewSecret}
      # skate-results API base + shared key for the mutating proxy routes
      # (import / delete). Key value comes from a gitignored .env.
      SKATE_RESULTS_API: ${SKATE_RESULTS_API:-https://skate-api.codrin.space}
      SKATE_RESULTS_API_KEY: ${SKATE_RESULTS_API_KEY:-}
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      # `default` keeps this service talking to its own database; the shared
      # net is only for reaching the sibling EduSport services.
      - default
      - edusport_net
    depends_on:
      - db

  db:
    # NOTE: production runs postgres:16. Staying on 15 here on purpose: the
    # existing `postgres_data` volume was initialised by 15, and 16 refuses to
    # start on it ("database files are incompatible with server"). Upgrading is
    # a deliberate step: pg_dump on 15, drop the volume, restore on 16. Do it
    # alongside the content export, not as a silent bump.
    image: postgres:15
    container_name: strapi_db
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi}
      POSTGRES_DB: ${DATABASE_NAME:-edusport_postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

networks:
  edusport_net:
    external: true

volumes:
  postgres_data:
